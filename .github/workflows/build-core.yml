name: Build musl cache
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nixpkgs_ref:
        description: Nixpkgs branch or full commit
        required: false
        default: master
permissions:
  contents: read
  id-token: write
concurrency:
  group: musl-cache-core
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare build matrices
    runs-on: ubuntu-24.04
    outputs:
      nixpkgs_revision: ${{ steps.plan.outputs.nixpkgs_revision }}
      bootstrap_xgcc: ${{ steps.plan.outputs.bootstrap_xgcc }}
      bootstrap_libc: ${{ steps.plan.outputs.bootstrap_libc }}
      bootstrap_stage2_tools: ${{ steps.plan.outputs.bootstrap_stage2_tools }}
      bootstrap_compiler_libs: ${{ steps.plan.outputs.bootstrap_compiler_libs }}
      bootstrap_final_gcc: ${{ steps.plan.outputs.bootstrap_final_gcc }}
      bootstrap_runtime: ${{ steps.plan.outputs.bootstrap_runtime }}
      final_stdenv: ${{ steps.plan.outputs.final_stdenv }}
      build_tools_core: ${{ steps.plan.outputs.build_tools_core }}
      foundation_roots: ${{ steps.plan.outputs.foundation_roots }}
      foundation_level2: ${{ steps.plan.outputs.foundation_level2 }}
      foundation_level3: ${{ steps.plan.outputs.foundation_level3 }}
      foundation_runtimes: ${{ steps.plan.outputs.foundation_runtimes }}
      network_level1: ${{ steps.plan.outputs.network_level1 }}
      network_level2: ${{ steps.plan.outputs.network_level2 }}
      build_tools_modern: ${{ steps.plan.outputs.build_tools_modern }}
      full_curl: ${{ steps.plan.outputs.full_curl }}
      git: ${{ steps.plan.outputs.git }}
      rust_core: ${{ steps.plan.outputs.rust_core }}
      rust_tools: ${{ steps.plan.outputs.rust_tools }}
      go_toolchain: ${{ steps.plan.outputs.go_toolchain }}
      smoke_tests: ${{ steps.plan.outputs.smoke_tests }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve nixpkgs revision and matrices
        id: plan
        env:
          NIXPKGS_REF: ${{ inputs.nixpkgs_ref || 'master' }}
        run: |
          if [[ "$NIXPKGS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            revision="$NIXPKGS_REF"
          else
            revision=$(git ls-remote https://github.com/NixOS/nixpkgs.git "refs/heads/$NIXPKGS_REF" | awk 'NR == 1 { print $1 }')
          fi

          if [[ -z "$revision" ]]; then
            echo "Could not resolve nixpkgs ref: $NIXPKGS_REF" >&2
            exit 1
          fi

          echo "Using nixpkgs revision $revision"

          phase_matrix() {
            local phase="$1"
            jq --compact-output --arg phase "$phase" '
              {
                include: [
                  .systems[] as $target
                  | .phases[$phase][]
                  | select(((.systems // [$target.system]) | index($target.system)) != null)
                  | {
                      package: .name,
                      system: $target.system,
                      runner: $target.runner
                    }
                ]
              }
            ' nix/cache-plan.json
          }

          wave_matrix() {
            local wave="$1"
            jq --compact-output --arg wave "$wave" '
              [.phases[][]] as $packages
              | {
                  include: [
                    .systems[] as $target
                    | .waves[$wave][] as $name
                    | $packages[]
                    | select(.name == $name)
                    | select(((.systems // [$target.system]) | index($target.system)) != null)
                    | {
                        package: .name,
                        system: $target.system,
                        runner: $target.runner
                      }
                  ]
                }
            ' nix/cache-plan.json
          }

          {
            echo "nixpkgs_revision=$revision"
            echo "bootstrap_xgcc=$(phase_matrix bootstrap-xgcc)"
            echo "bootstrap_libc=$(phase_matrix bootstrap-libc)"
            echo "bootstrap_stage2_tools=$(phase_matrix bootstrap-stage2-tools)"
            echo "bootstrap_compiler_libs=$(phase_matrix bootstrap-compiler-libs)"
            echo "bootstrap_final_gcc=$(phase_matrix bootstrap-final-gcc)"
            echo "bootstrap_runtime=$(phase_matrix bootstrap-runtime)"
            echo "final_stdenv=$(phase_matrix final-stdenv)"
            echo "build_tools_core=$(wave_matrix build-tools-core)"
            echo "foundation_roots=$(wave_matrix foundation-roots)"
            echo "foundation_level2=$(wave_matrix foundation-level2)"
            echo "foundation_level3=$(wave_matrix foundation-level3)"
            echo "foundation_runtimes=$(wave_matrix foundation-runtimes)"
            echo "network_level1=$(wave_matrix network-level1)"
            echo "network_level2=$(wave_matrix network-level2)"
            echo "build_tools_modern=$(wave_matrix build-tools-modern)"
            echo "full_curl=$(wave_matrix full-curl)"
            echo "git=$(wave_matrix git)"
            echo "rust_core=$(phase_matrix rust-core)"
            echo "rust_tools=$(phase_matrix rust-tools)"
            echo "go_toolchain=$(phase_matrix go-toolchain)"
            echo "smoke_tests=$(phase_matrix smoke-tests)"
          } >> "$GITHUB_OUTPUT"
  bootstrap-xgcc:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bootstrap_xgcc) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  bootstrap-libc:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - bootstrap-xgcc
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bootstrap_libc) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  bootstrap-stage2-tools:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - bootstrap-libc
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bootstrap_stage2_tools) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  bootstrap-compiler-libs:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - bootstrap-stage2-tools
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bootstrap_compiler_libs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  bootstrap-final-gcc:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - bootstrap-compiler-libs
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bootstrap_final_gcc) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  bootstrap-runtime:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - bootstrap-final-gcc
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bootstrap_runtime) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  final-stdenv:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - bootstrap-runtime
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.final_stdenv) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  build-tools-core:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - final-stdenv
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.build_tools_core) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  foundation-roots:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - build-tools-core
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.foundation_roots) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  foundation-level2:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - foundation-roots
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.foundation_level2) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  foundation-level3:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - foundation-level2
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.foundation_level3) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
