name: Build musl cache
on:
  workflow_dispatch:
    inputs:
      nixpkgs_ref:
        description: Nixpkgs branch or full commit
        required: false
        default: master
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/actions/build-package/**
      - .github/workflows/build-core.yml
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
  id-token: write
concurrency:
  group: musl-cache-core
  cancel-in-progress: false
jobs:
  prepare:
    name: Generate dependency layers
    runs-on: ubuntu-24.04
    outputs:
      nixpkgs_revision: ${{ steps.plan.outputs.nixpkgs_revision }}
      layers: ${{ steps.plan.outputs.layers }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - id: plan
        name: Resolve nixpkgs and dependency layers
        shell: bash
        env:
          NIXPKGS_REF: ${{ inputs.nixpkgs_ref || 'master' }}
        run: |
          if [[ "$NIXPKGS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            revision="$NIXPKGS_REF"
          else
            revision="$(git ls-remote https://github.com/NixOS/nixpkgs.git "refs/heads/$NIXPKGS_REF" | awk 'NR == 1 { print $1 }')"
          fi

          if [[ -z "$revision" ]]; then
            echo "Could not resolve nixpkgs ref: $NIXPKGS_REF" >&2
            exit 1
          fi

          nix flake lock \
            --override-input nixpkgs-build "github:NixOS/nixpkgs/$revision"
          layers="$(python3 nix/generate_layers.py --workflow core --max-layers 32)"

          {
            echo "nixpkgs_revision=$revision"
            echo "layers=$layers"
          } >>"$GITHUB_OUTPUT"
  layer-00:
    name: Layer 00 / ${{ matrix.system }} / ${{ matrix.package }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.layers)[0] }}
    steps: &build-steps
      - if: ${{ matrix.enabled }}
        uses: actions/checkout@v5
      - if: ${{ matrix.enabled }}
        uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  layer-01:
    name: Layer 01 / ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - layer-00
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.layers)[1] }}
    steps: *build-steps
  layer-02:
