  build-tools-modern:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - network-level2
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.build_tools_modern) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  full-curl:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - build-tools-modern
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.full_curl) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  git:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - full-curl
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.git) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  rust-core:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - git
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.rust_core) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
