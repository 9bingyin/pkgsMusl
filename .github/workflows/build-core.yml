    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.foundation_runtimes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  network-level1:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - foundation-runtimes
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.network_level1) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
  network-level2:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    needs:
      - prepare
      - network-level1
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.network_level2) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
        with:
