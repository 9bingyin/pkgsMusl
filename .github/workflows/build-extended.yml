name: Build extended musl cache
on:
  schedule:
    - cron: "43 3 * * 6"
  workflow_dispatch:
    inputs:
      nixpkgs_ref:
        description: Nixpkgs branch or full commit
        required: false
        default: master
permissions:
  contents: read
  id-token: write
concurrency:
  group: musl-cache-extended
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      nixpkgs_revision: ${{ steps.plan.outputs.nixpkgs_revision }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        name: Resolve nixpkgs and package sets
        shell: bash
        env:
          NIXPKGS_REF: ${{ inputs.nixpkgs_ref || 'master' }}
        run: |
          if [[ "$NIXPKGS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            revision="$NIXPKGS_REF"
          else
            revision="$(git ls-remote https://github.com/NixOS/nixpkgs.git "refs/heads/$NIXPKGS_REF" | awk 'NR == 1 { print $1 }')"
          fi

          if [[ -z "$revision" ]]; then
            echo "Could not resolve nixpkgs ref: $NIXPKGS_REF" >&2
            exit 1
          fi

          matrix="$(jq --compact-output --arg workflow extended '
            {
              include: [
                .systems[] as $target
                | {
                    system: $target.system,
                    runner: $target.runner,
                    packages: ([
                      .workflows[$workflow][] as $phase
                      | .phases[$phase][]
                      | select(((.systems // [$target.system]) | index($target.system)) != null)
                      | .name
                    ] | tojson)
                  }
              ]
            }
          ' nix/cache-plan.json)"

          {
            echo "nixpkgs_revision=$revision"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"
  build:
    name: ${{ matrix.system }} / extended package graph
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Maximize Nix store space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: "4096"
          temp-reserve-mb: "1024"
          swap-size-mb: "4096"
          build-mount-path: /nix
          build-mount-path-ownership: root:root
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-packages
        with:
          packages: ${{ matrix.packages }}
          nixpkgs-revision: ${{ needs.prepare.outputs.nixpkgs_revision }}
