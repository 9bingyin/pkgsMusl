name: Build derivation
description: Build one derivation and upload its outputs to niks3
inputs:
  package:
    description: Root flake package used to instantiate the derivation closure
    required: true
  owner-system:
    description: Nix system of the root package
    required: true
  derivation:
    description: Exact derivation path to build
    required: true
  outputs:
    description: Comma-separated derivation outputs to realise
    required: true
  inputs:
    description: JSON array of direct derived paths and source paths
    required: true
  nixpkgs-revision:
    description: Nixpkgs revision used for the build
    required: true
runs:
  using: composite
  steps:
    - name: Enable TCP BBR
      shell: bash
      run: |
        if ! sudo modprobe tcp_bbr 2>/dev/null; then
          echo "::notice::tcp_bbr is unavailable; keeping the default congestion control"
          exit 0
        fi

        if ! sysctl -n net.ipv4.tcp_available_congestion_control | grep -qw bbr; then
          echo "::notice::BBR is unavailable; keeping the default congestion control"
          exit 0
        fi

        sudo sysctl -q -w net.core.default_qdisc=fq
        sudo sysctl -q -w net.ipv4.tcp_congestion_control=bbr
        echo "TCP congestion control: $(sysctl -n net.ipv4.tcp_congestion_control)"
        echo "Default qdisc: $(sysctl -n net.core.default_qdisc)"
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ github.token }}
    - name: Configure niks3 cache
      uses: Mic92/niks3-action@v1
      with:
        server-url: https://niks3.bingyin.org
    - name: Build derivation
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        OWNER_SYSTEM: ${{ inputs.owner-system }}
        DERIVATION: ${{ inputs.derivation }}
        OUTPUTS: ${{ inputs.outputs }}
        DIRECT_INPUTS: ${{ inputs.inputs }}
        NIXPKGS_REVISION: ${{ inputs.nixpkgs-revision }}
      run: |
        owner_drv="$(nix eval \
          --raw \
          --override-input nixpkgs-build "github:NixOS/nixpkgs/$NIXPKGS_REVISION" \
          ".#packages.$OWNER_SYSTEM.$PACKAGE.drvPath")"
        owner_graph="$(mktemp)"
        trap 'rm -f "$owner_graph"' EXIT
        nix derivation show --recursive "$owner_drv" >"$owner_graph"

        if ! jq -e \
          --arg full "$DERIVATION" \
          --arg base "$(basename "$DERIVATION")" \
          '(.derivations // .) | has($full) or has($base)' \
          "$owner_graph" >/dev/null; then
          echo "Planned derivation is not reachable from $OWNER_SYSTEM:$PACKAGE: $DERIVATION" >&2
          exit 1
        fi
        if [[ -z "$OUTPUTS" ]]; then
          echo "No derivation outputs were selected for $DERIVATION" >&2
          exit 1
        fi
        if ! jq -e 'type == "array" and all(.[]; type == "string")' \
          <<<"$DIRECT_INPUTS" >/dev/null; then
          echo "Invalid direct input list for $DERIVATION" >&2
          exit 1
        fi

        mapfile -t direct_inputs < <(jq -r '.[]' <<<"$DIRECT_INPUTS")
        if (( ${#direct_inputs[@]} > 0 )); then
          nix build \
            --no-link \
            --print-build-logs \
            --max-jobs 0 \
            --builders '' \
            --option always-allow-substitutes true \
            "${direct_inputs[@]}"
        fi

        nix build \
          --no-link \
          --print-build-logs \
          --max-jobs 1 \
          --cores 0 \
          --builders '' \
          --option always-allow-substitutes true \
          "$DERIVATION^$OUTPUTS"
