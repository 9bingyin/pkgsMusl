name: Build package
description: Build one flake package and upload completed derivations to niks3
inputs:
  package:
    description: Flake package name
    required: true
  nixpkgs-revision:
    description: Nixpkgs revision used for the build
    required: true
runs:
  using: composite
  steps:
    - name: Enable TCP BBR
      shell: bash
      run: |
        if ! sudo modprobe tcp_bbr 2>/dev/null; then
          echo "::notice::tcp_bbr is unavailable; keeping the default congestion control"
          exit 0
        fi

        if ! sysctl -n net.ipv4.tcp_available_congestion_control | grep -qw bbr; then
          echo "::notice::BBR is unavailable; keeping the default congestion control"
          exit 0
        fi

        sudo sysctl -q -w net.core.default_qdisc=fq
        sudo sysctl -q -w net.ipv4.tcp_congestion_control=bbr
        echo "TCP congestion control: $(sysctl -n net.ipv4.tcp_congestion_control)"
        echo "Default qdisc: $(sysctl -n net.core.default_qdisc)"
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ github.token }}
    - name: Configure niks3 cache
      uses: Mic92/niks3-action@v1
      with:
        server-url: https://niks3.bingyin.org
    - name: Build package
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        NIXPKGS_REVISION: ${{ inputs.nixpkgs-revision }}
      run: |
        nix build \
          --no-link \
          --print-build-logs \
          --max-jobs auto \
          --cores 0 \
          --override-input nixpkgs-build "github:NixOS/nixpkgs/$NIXPKGS_REVISION" \
          ".#$PACKAGE"
